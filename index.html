<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <meta name="description" content="個人・小規模事業者向け勤怠管理PWA">
  <style>
:root{--navy:#17324d;--blue:#2f75b5;--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#657383;--border:#d9e1e8;--danger:#f5d4d0;--warn:#fce7c2;--success:#dcefd8;--accent:#e5f0f8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app-header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.app-header h1{margin:0;font-size:1.25rem}.app-header p{margin:2px 0 0;font-size:.85rem;opacity:.85}main{max-width:900px;margin:auto;padding:12px 12px 80px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}.tab{border:0;padding:11px 4px;border-radius:10px;background:#e5e9ed;color:#34404c}.tab.active{background:var(--blue);color:#fff}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}.card h2{font-size:1.05rem;margin:0 0 12px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.status-grid.four{grid-template-columns:repeat(4,1fr)}.metric{background:var(--accent);border-radius:14px;padding:12px;text-align:center;min-height:78px;display:flex;flex-direction:column;justify-content:center}.metric span{font-size:.78rem;color:var(--muted)}.metric strong{font-size:1.25rem}.metric.danger{background:var(--danger)}.metric.warning{background:var(--warn)}.metric.success{background:var(--success)}label{display:block;font-size:.9rem;margin-bottom:12px}input,select,textarea{width:100%;margin-top:5px;border:1px solid var(--border);border-radius:10px;padding:11px;background:#fff}input[type=time],input[type=month]{min-width:0}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time-row{display:grid;grid-template-columns:1fr 48px;gap:6px}.time-row input{margin-top:5px}.now{margin-top:5px;border:1px solid var(--border);border-radius:10px;background:#eef3f7}.primary{border:0;border-radius:11px;padding:13px;background:var(--blue);color:#fff;font-weight:700;width:100%}.ghost{border:1px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:8px}.message{min-height:1.2em;color:#176b3a}.summary-list{margin:0}.summary-list div{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:9px 0}.summary-list dt{color:var(--muted)}.summary-list dd{margin:0;font-weight:700}.progress{height:12px;border-radius:20px;background:#e4e8ec;overflow:hidden}.progress div{height:100%;width:0;background:var(--blue);transition:width .2s}.table-wrap{overflow:auto}.table-wrap table{border-collapse:collapse;width:100%;min-width:560px}.table-wrap th,.table-wrap td{border-bottom:1px solid var(--border);padding:9px 7px;text-align:right;white-space:nowrap}.table-wrap th:first-child,.table-wrap td:first-child{text-align:left}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-head input{width:auto;margin:0}.hint{color:var(--muted);font-size:.85rem}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid var(--border);border-radius:9px;background:#fff;min-height:58px;padding:5px;text-align:left}.day small{display:block;color:var(--muted)}.day.holiday{background:var(--danger)}.day.company{background:var(--warn)}.day.work{background:#f5f9fc}.day.outside{opacity:.3}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.settings-grid h2,.settings-grid button{grid-column:1/-1}.button-row{display:flex;flex-wrap:wrap;gap:8px}.button-row button,.file-button{border:1px solid var(--border);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer}.file-button input{display:none}.danger-button{color:#9c0006!important;background:#f8dddd!important}dialog{border:0;border-radius:16px;width:min(92vw,420px)}dialog::backdrop{background:#0008}dialog form{padding:4px}.type-出勤{background:#e2f0d9}.type-休日出勤{background:#f4cccc}.type-公休{background:#e7e6e6}.type-有休{background:#fff2cc}.type-代休{background:#e4dfec}@media(max-width:620px){.status-grid.four{grid-template-columns:1fr 1fr}.metric strong{font-size:1.1rem}.settings-grid{grid-template-columns:1fr}.time-grid{grid-template-columns:1fr 1fr}.tabs{position:sticky;top:66px;z-index:9}.tab{font-size:.82rem}.calendar-grid{gap:3px}.day{min-height:52px;font-size:.85rem}}

  </style>
  <title>勤怠管理</title>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>勤怠管理</h1>
      <p id="todayLabel"></p>
    </div>
    <button id="installBtn" class="ghost" hidden>ホーム画面に追加</button>
  </header>

  <main>
    <nav class="tabs" aria-label="画面切替">
      <button class="tab active" data-view="today">今日</button>
      <button class="tab" data-view="dashboard">集計</button>
      <button class="tab" data-view="calendar">休日</button>
      <button class="tab" data-view="ledger">台帳</button>
      <button class="tab" data-view="settings">設定</button>
    </nav>

    <section id="view-today" class="view active">
      <div class="status-grid">
        <article class="metric danger"><span>代休残</span><strong id="metricComp">0.0日</strong></article>
        <article class="metric"><span>今月残業</span><strong id="metricMonthOt">0.0h</strong></article>
        <article class="metric"><span>年残業</span><strong id="metricYearOt">0.0h</strong></article>
      </div>

      <article class="card input-card">
        <label>勤務区分
          <select id="workType">
            <option>出勤</option><option>休日出勤</option><option>公休</option><option>有休</option><option>代休</option><option>特休</option>
          </select>
        </label>

        <div class="time-grid">
          <label>出勤<div class="time-row"><input id="start" type="time"><button class="now" data-target="start">今</button></div></label>
          <label>退勤<div class="time-row"><input id="end" type="time"><button class="now" data-target="end">今</button></div></label>
          <label>外出<div class="time-row"><input id="out" type="time"><button class="now" data-target="out">今</button></div></label>
          <label>戻り<div class="time-row"><input id="back" type="time"><button class="now" data-target="back">今</button></div></label>
        </div>

        <label>備考<textarea id="note" rows="2" placeholder="現場名、外出理由など"></textarea></label>
        <button id="saveToday" class="primary">今日の勤怠を保存</button>
        <p id="saveMessage" class="message" aria-live="polite"></p>
      </article>

      <article class="card summary-card">
        <h2>今日の計算</h2>
        <dl class="summary-list">
          <div><dt>自動休憩</dt><dd id="todayBreak">0.00h</dd></div>
          <div><dt>外出控除</dt><dd id="todayOutside">0.00h</dd></div>
          <div><dt>就労時間</dt><dd id="todayWork">0.00h</dd></div>
          <div><dt>時間外</dt><dd id="todayOt">0.00h</dd></div>
          <div><dt>早朝／夕方／深夜</dt><dd id="todayBands">0.00 / 0.00 / 0.00h</dd></div>
        </dl>
      </article>
    </section>

    <section id="view-dashboard" class="view">
      <div class="status-grid four">
        <article class="metric danger"><span>代休残</span><strong id="dashComp">0.0日</strong></article>
        <article class="metric"><span>予定休日</span><strong id="dashPlanned">0日</strong></article>
        <article class="metric warning"><span>休日出勤</span><strong id="dashHolidayWork">0日</strong></article>
        <article class="metric success"><span>実質休日</span><strong id="dashActualHoliday">0日</strong></article>
      </div>
      <article class="card">
        <h2>36協定進捗</h2>
        <div class="progress"><div id="yearOtBar"></div></div>
        <p id="yearOtText"></p>
      </article>
      <article class="card">
        <h2>月次一覧</h2>
        <div class="table-wrap"><table><thead><tr><th>月度</th><th>就労</th><th>残業</th><th>休日出勤</th><th>代休残</th></tr></thead><tbody id="monthRows"></tbody></table></div>
      </article>
    </section>

    <section id="view-calendar" class="view">
      <article class="card">
        <div class="section-head"><h2>会社カレンダー</h2><input id="calendarMonth" type="month"></div>
        <p class="hint">初期値は土曜＝所定休日、日曜＝法定休日です。日付を押して変更します。</p>
        <div id="calendarGrid" class="calendar-grid"></div>
      </article>
    </section>

    <section id="view-ledger" class="view">
      <article class="card">
        <div class="section-head"><h2>勤怠台帳</h2><input id="ledgerMonth" type="month"></div>
        <div class="table-wrap"><table><thead><tr><th>日付</th><th>区分</th><th>出勤</th><th>退勤</th><th>就労</th><th>残業</th><th>代休残</th></tr></thead><tbody id="ledgerRows"></tbody></table></div>
      </article>
    </section>

    <section id="view-settings" class="view">
      <article class="card settings-grid">
        <h2>一括設定</h2>
        <label>年度開始年<input id="fiscalYear" type="number" min="2020" max="2100"></label>
        <label>年間休日目標<input id="annualHolidayTarget" type="number" step="1"></label>
        <label>標準就労時間(h)<input id="standardHours" type="number" step="0.25"></label>
        <label>基本休憩(h)<input id="baseBreak" type="number" step="0.25"></label>
        <label>夜間追加休憩(h)<input id="extraBreak" type="number" step="0.25"></label>
        <label>追加休憩判定<input id="extraBreakAfter" type="time"></label>
        <label>丸め単位(分)<input id="roundMinutes" type="number" step="5"></label>
        <label>出勤丸め<select id="roundStart"><option>切上</option><option>切捨</option><option>四捨五入</option></select></label>
        <label>退勤丸め<select id="roundEnd"><option>切上</option><option>切捨</option><option>四捨五入</option></select></label>
        <label>早朝開始<input id="earlyStart" type="time"></label>
        <label>標準開始<input id="normalStart" type="time"></label>
        <label>標準終了<input id="normalEnd" type="time"></label>
        <label>深夜開始<input id="nightStart" type="time"></label>
        <label>月残業上限(h)<input id="monthOtLimit" type="number"></label>
        <label>年残業上限(h)<input id="yearOtLimit" type="number"></label>
        <button id="saveSettings" class="primary">設定を保存</button>
      </article>

      <article class="card">
        <h2>バックアップ</h2>
        <div class="button-row">
          <button id="exportJson">JSON保存</button>
          <label class="file-button">JSON読込<input id="importJson" type="file" accept="application/json"></label>
          <button id="exportCsv">CSV出力</button>
          <button id="resetData" class="danger-button">全データ初期化</button>
        </div>
      </article>
    </section>
  </main>

  <dialog id="holidayDialog">
    <form method="dialog">
      <h2 id="holidayDateLabel">休日設定</h2>
      <label>区分<select id="holidayType"><option>勤務日</option><option>所定休日</option><option>法定休日</option><option>会社休業日</option></select></label>
      <label>名称<input id="holidayName" placeholder="祝日、夏季休暇など"></label>
      <div class="button-row"><button value="cancel">取消</button><button id="saveHoliday" value="default" class="primary">保存</button></div>
    </form>
  </dialog>

  <script>
'use strict';
const KEY='attendancePwaV2';
const defaults={settings:{fiscalYear:new Date().getFullYear(),annualHolidayTarget:110,standardHours:8,baseBreak:1,extraBreak:.25,extraBreakAfter:'18:00',roundMinutes:15,roundStart:'切上',roundEnd:'切捨',earlyStart:'05:00',normalStart:'08:30',normalEnd:'17:30',nightStart:'22:00',monthOtLimit:45,yearOtLimit:360},records:{},calendar:{}};
let state=load();let deferredPrompt=null;let dialogDate='';
const $=id=>document.getElementById(id);
function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'),{settings:Object.assign({},defaults.settings,JSON.parse(localStorage.getItem(KEY)||'{}').settings||{})});}catch{return structuredClone(defaults)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));}
function iso(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function hm(date=new Date()){return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`}
function mins(t){if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m}
function roundTime(t,unit,mode){if(!t)return'';const v=mins(t);let r=mode==='切上'?Math.ceil(v/unit)*unit:mode==='切捨'?Math.floor(v/unit)*unit:Math.round(v/unit)*unit;r%=1440;return `${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`}
function duration(a,b){let x=mins(a),y=mins(b);if(x==null||y==null)return 0;if(y<x)y+=1440;return (y-x)/60}
function overlap(start,end,bs,be){let s=mins(start),e=mins(end),a=mins(bs),b=mins(be);if([s,e,a,b].some(v=>v==null))return 0;if(e<s)e+=1440;if(b<=a)b+=1440;let total=Math.max(0,Math.min(e,b)-Math.max(s,a));total+=Math.max(0,Math.min(e,b+1440)-Math.max(s,a+1440));return total/60}
function fiscalBounds(){const y=+state.settings.fiscalYear;return [new Date(y,3,21),new Date(y+1,3,20)]}
function fiscalMonthIndex(date){const [start]=fiscalBounds();let i=(date.getFullYear()-start.getFullYear())*12+date.getMonth()-start.getMonth();if(date.getDate()<21)i--;return Math.max(0,Math.min(11,i))}
function fiscalMonthLabel(i){return `${((3+i)%12)+1}月度`}
function defaultHoliday(date){const day=date.getDay();if(day===0)return{type:'法定休日',name:''};if(day===6)return{type:'所定休日',name:''};return{type:'勤務日',name:''}}
function holidayFor(key){const d=new Date(key+'T00:00:00');return state.calendar[key]||defaultHoliday(d)}
function calcRecord(key,rec={}){const s=state.settings;const rs=roundTime(rec.start,s.roundMinutes,s.roundStart),re=roundTime(rec.end,s.roundMinutes,s.roundEnd);const isWork=['出勤','休日出勤'].includes(rec.type);const extra=(rec.end&&rec.start&&(mins(rec.end)<mins(rec.start)||mins(rec.end)>=mins(s.extraBreakAfter)))?s.extraBreak:0;const br=isWork?s.baseBreak+extra:0;const outside=duration(rec.out,rec.back);const gross=duration(rs,re);const work=Math.max(0,gross-br-outside);const standard=rec.type==='出勤'?s.standardHours:0;const overtime=Math.max(0,work-standard);let early=overlap(rs,re,s.earlyStart,s.normalStart),evening=overlap(rs,re,s.normalEnd,s.nightStart),night=overlap(rs,re,s.nightStart,s.earlyStart);if(rec.out&&rec.back){early=Math.max(0,early-overlap(rec.out,rec.back,s.earlyStart,s.normalStart));evening=Math.max(0,evening-overlap(rec.out,rec.back,s.normalEnd,s.nightStart));night=Math.max(0,night-overlap(rec.out,rec.back,s.nightStart,s.earlyStart));}const hol=holidayFor(key);const holidayWork=isWork&&hol.type!=='勤務日'?work:0;const compEarn=rec.type==='休日出勤'&&holidayWork>0?1:0;const compUse=rec.type==='代休'?1:0;return{rs,re,breakHours:br,outside,work,standard,overtime,early,evening,night,holidayWork,compEarn,compUse,hol}}
function allKeys(){const [a,b]=fiscalBounds(),arr=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))arr.push(iso(d));return arr}
function stats(){let comp=0,yearOt=0,holidayWorkDays=0,planned=0,actualHoliday=0;const months=Array.from({length:12},(_,i)=>({label:fiscalMonthLabel(i),work:0,ot:0,holidayWork:0,comp:0}));for(const key of allKeys()){const rec=state.records[key]||{};const c=calcRecord(key,rec);if(c.hol.type!=='勤務日')planned++;comp+=c.compEarn-c.compUse;yearOt+=c.overtime;if(c.compEarn)holidayWorkDays++;const i=fiscalMonthIndex(new Date(key+'T00:00:00'));months[i].work+=c.work;months[i].ot+=c.overtime;months[i].holidayWork+=c.compEarn;months[i].comp=comp;}actualHoliday=planned-holidayWorkDays+Object.values(state.records).filter(r=>r.type==='代休').length;return{comp,yearOt,holidayWorkDays,planned,actualHoliday,months}}
function monthStats(date=new Date()){const i=fiscalMonthIndex(date);return stats().months[i]}
function renderToday(){const key=iso(),rec=state.records[key]||{type:'出勤'};$('todayLabel').textContent=new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date());$('workType').value=rec.type||'出勤';['start','end','out','back','note'].forEach(id=>$(id).value=rec[id]||'');const c=calcRecord(key,rec),st=stats(),ms=monthStats();$('metricComp').textContent=st.comp.toFixed(1)+'日';$('metricMonthOt').textContent=ms.ot.toFixed(1)+'h';$('metricYearOt').textContent=st.yearOt.toFixed(1)+'h';$('todayBreak').textContent=c.breakHours.toFixed(2)+'h';$('todayOutside').textContent=c.outside.toFixed(2)+'h';$('todayWork').textContent=c.work.toFixed(2)+'h';$('todayOt').textContent=c.overtime.toFixed(2)+'h';$('todayBands').textContent=`${c.early.toFixed(2)} / ${c.evening.toFixed(2)} / ${c.night.toFixed(2)}h`;}
function renderDashboard(){const st=stats();$('dashComp').textContent=st.comp.toFixed(1)+'日';$('dashPlanned').textContent=st.planned+'日';$('dashHolidayWork').textContent=st.holidayWorkDays+'日';$('dashActualHoliday').textContent=st.actualHoliday+'日';const pct=Math.min(100,st.yearOt/state.settings.yearOtLimit*100);$('yearOtBar').style.width=pct+'%';$('yearOtText').textContent=`${st.yearOt.toFixed(1)} / ${state.settings.yearOtLimit} h（残り ${(state.settings.yearOtLimit-st.yearOt).toFixed(1)} h）`;$('monthRows').innerHTML=st.months.map(m=>`<tr><td>${m.label}</td><td>${m.work.toFixed(1)}</td><td>${m.ot.toFixed(1)}</td><td>${m.holidayWork}</td><td>${m.comp.toFixed(1)}</td></tr>`).join('');}
function renderCalendar(){const val=$('calendarMonth').value||iso().slice(0,7);$('calendarMonth').value=val;const [y,m]=val.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),h=holidayFor(key),cls=d.getMonth()!==m-1?'outside':h.type==='勤務日'?'work':h.type==='会社休業日'?'company':'holiday';cells.push(`<button class="day ${cls}" data-date="${key}"><b>${d.getDate()}</b><small>${h.name||h.type}</small></button>`)}$('calendarGrid').innerHTML=cells.join('');document.querySelectorAll('.day').forEach(b=>b.addEventListener('click',()=>openHoliday(b.dataset.date)));}
function renderLedger(){const val=$('ledgerMonth').value||iso().slice(0,7);$('ledgerMonth').value=val;const [y,m]=val.split('-').map(Number),days=new Date(y,m,0).getDate();let comp=0;for(const key of allKeys()){const c=calcRecord(key,state.records[key]||{});comp+=c.compEarn-c.compUse;if(key.slice(0,7)===val){const r=state.records[key]||{},tr=document.createElement('tr');tr.className='type-'+(r.type||'');tr.innerHTML=`<td>${key.slice(5)} (${holidayFor(key).type})</td><td>${r.type||''}</td><td>${r.start||''}</td><td>${r.end||''}</td><td>${c.work.toFixed(2)}</td><td>${c.overtime.toFixed(2)}</td><td>${comp.toFixed(1)}</td>`;$('ledgerRows').appendChild(tr)}}if(!$('ledgerRows').children.length)$('ledgerRows').innerHTML='<tr><td colspan="7">データなし</td></tr>';}
function renderSettings(){Object.keys(state.settings).forEach(k=>{const el=$(k);if(el)el.value=state.settings[k]});}
function renderAll(){renderToday();renderDashboard();renderCalendar();$('ledgerRows').innerHTML='';renderLedger();renderSettings();}
function openHoliday(key){dialogDate=key;const h=holidayFor(key);$('holidayDateLabel').textContent=key;$('holidayType').value=h.type;$('holidayName').value=h.name||'';$('holidayDialog').showModal();}
function saveToday(){const key=iso();state.records[key]={type:$('workType').value,start:$('start').value,end:$('end').value,out:$('out').value,back:$('back').value,note:$('note').value};persist();renderAll();$('saveMessage').textContent='保存しました';setTimeout(()=>$('saveMessage').textContent='',1800)}
function saveSettings(){Object.keys(state.settings).forEach(k=>{const el=$(k);if(!el)return;state.settings[k]=el.type==='number'?Number(el.value):el.value});persist();renderAll();alert('設定を保存しました')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportCsv(){const rows=[['日付','勤務区分','出勤','退勤','外出','戻り','備考']];Object.entries(state.records).sort().forEach(([k,r])=>rows.push([k,r.type||'',r.start||'',r.end||'',r.out||'',r.back||'',r.note||'']));download('attendance.csv','\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')}
function setup(){document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('view-'+b.dataset.view).classList.add('active');if(b.dataset.view==='ledger'){$('ledgerRows').innerHTML='';renderLedger()}}));document.querySelectorAll('.now').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();$(b.dataset.target).value=hm();renderToday()}));['workType','start','end','out','back'].forEach(id=>$(id).addEventListener('change',renderToday));$('saveToday').addEventListener('click',saveToday);$('calendarMonth').addEventListener('change',renderCalendar);$('ledgerMonth').addEventListener('change',()=>{$('ledgerRows').innerHTML='';renderLedger()});$('saveHoliday').addEventListener('click',()=>{state.calendar[dialogDate]={type:$('holidayType').value,name:$('holidayName').value};persist();renderAll()});$('saveSettings').addEventListener('click',saveSettings);$('exportJson').addEventListener('click',()=>download('attendance-backup.json',JSON.stringify(state,null,2),'application/json'));$('importJson').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);persist();renderAll();alert('復元しました')};r.readAsText(f)});$('exportCsv').addEventListener('click',exportCsv);$('resetData').addEventListener('click',()=>{if(confirm('すべてのデータを削除しますか？')){state=structuredClone(defaults);persist();renderAll()}});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').hidden=false});$('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').hidden=true}});renderAll();}
setup();

  </script>
</body>
